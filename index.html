<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f79922">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NNMKP Staff">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NNMKP Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Noto+Sans+Thai:wght@400;500;700&display=swap">
<style>

/* Layout: one narrow column built for a phone held in one hand. Big tap tiles, bottom tab bar, green payslip card echoing the printed slips. */
:root{
  /* NNMKP brand: orange #f79922, rust #973b20, cream #fff3d9. One light look on purpose, so the cream background shows for everyone. */
  color-scheme:light;
  --bg:#fff3d9; --surface:#fffbf2; --fg:#3a1f14; --muted:#7d5c49; --line:#ecd6a8;
  --accent:#f79922; --accent-ink:#3a1a0c; --accent-soft:#fde2b0;
  --brand2:#973b20; --on-brand2:#fff3d9;
  --ok:#2f7a4d; --ok-soft:#d9eddc; --warn:#8a6100; --warn-soft:#fbeeb4;
  --bad:#973b20; --bad-soft:#f5d8cc; --off:#eadcc2;
  --f-display:"Mitr","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
b,strong{font-weight:500}
/* iOS standalone: fixed bottom bar floats on pages too short to scroll, so every page is made 2px taller than the screen */
body{margin:0;min-height:calc(100vh + 2px);background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:24px;padding-block:16px 96px}
button,input,select{font:inherit;color:inherit}
input{accent-color:var(--accent)}
input[type=date]{color-scheme:light;color:var(--fg);background:var(--bg);text-align:left}
input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.8}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.app{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
/* Orange brand band, full width, same look as the NNMKP Hub header. */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent);color:#fff;
  margin:-16px calc(50% - 50vw) 0;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,calc(50vw - 304px)) 18px}
.top .who{min-width:0}
.top .who b{font-family:var(--f-display);font-weight:400;font-size:1.375rem;line-height:1.3;display:block}
.top .who span{color:rgba(255,255,255,.92);font-size:.9375rem}
.circ{flex:none;width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);background:transparent;color:#fff;display:flex;align-items:center;justify-content:center}
.circ:active{background:rgba(255,255,255,.2)}
.circ svg{width:24px;height:24px}
.top :focus-visible{outline-color:#fff}
body{overflow-x:clip}
/* Splash / holding screen: shown while the saved login is checked and data loads, so the sign-in form never flashes. */
.splash{position:fixed;inset:0;z-index:100;background:var(--accent);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.splash img{width:132px;height:132px;display:block}
.splash b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;letter-spacing:.02em}
.splash.off{opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s}
/* Indeterminate loading bar: white track, rust block sliding back and forth. */
.ld{width:min(48vw,240px);height:7px;border-radius:99px;background:#fff;overflow:hidden;margin-top:36px}
.ld i{display:block;width:34%;height:100%;border-radius:99px;background:var(--brand2);animation:ldslide 1.1s ease-in-out infinite alternate}
@keyframes ldslide{from{transform:translateX(0)}to{transform:translateX(194%)}}
.ldtxt{font-size:1rem;color:#fff;margin-top:-4px}
@media (prefers-reduced-motion:reduce){.ld i{animation-duration:3s}}
#sbtint{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + 2px);background:var(--accent);z-index:50;pointer-events:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sub{color:var(--muted);font-size:.875rem}
.grp{display:flex;flex-direction:column;gap:8px}
.grp>h2{font-size:.8125rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-family:var(--f-body);font-weight:500}
.acctcard{padding:16px 0 4px;gap:0}
.acctcard h1{padding:0 16px 12px}
.acct{display:flex;align-items:center;border-top:1px solid var(--line)}
.acct-main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:12px 8px 12px 16px;border:0;background:transparent;text-align:left;min-height:72px}
.acct-main .av{flex:none;width:54px;height:54px;border-radius:50%;background:var(--accent-soft);color:var(--brand2);display:flex;align-items:center;justify-content:center}
.acct-main .av svg{width:28px;height:28px}
.acct-main .ai{flex:1;min-width:0;display:flex;flex-direction:column}
.acct-main .ai b{font-size:1.125rem;font-weight:500}
.acct-main .ai small{color:var(--muted);font-size:.9375rem;font-variant-numeric:tabular-nums}
.acct-main .chev,.acct-x{color:var(--muted)}
.acct-main .chev svg,.acct-x svg{width:22px;height:22px;display:block}
.acct-x{flex:none;width:52px;height:72px;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.acct-main:active,.acct-x:active{background:var(--accent-soft)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:72px}
.tile .tn{font-family:var(--f-display);font-size:1.375rem;line-height:1.3}
.tile .tm{color:var(--muted);font-size:.875rem}
.tile:active{background:var(--accent-soft)}
.dots{display:flex;gap:14px;justify-content:center;padding-block:8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);display:block}
.dots i.on{background:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin-inline:auto;width:100%}
.pad button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;font-family:var(--f-display)}
.pad button:active{background:var(--accent-soft)}
.pad .fn{font-size:1rem;font-family:var(--f-body);color:var(--muted)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav b{font-family:var(--f-display);font-weight:400;font-size:1.125rem}
.nav button{min-width:48px;min-height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.25rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dw{text-align:center;font-size:.8125rem;color:var(--muted);padding-block:4px}
.cal button,.cal .blank{min-height:58px;border-radius:10px}
.cal button{border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;padding:4px 2px;font-variant-numeric:tabular-nums}
.cal button .d{font-weight:500}
.cal button .t{font-size:.6875rem;line-height:1.2;text-align:center}
.cal button.off{background:var(--off);color:var(--muted)}
.cal button.pending{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.cal button.cover{background:var(--ok-soft);color:var(--ok)}
.cal button.rejected{background:var(--bad-soft);color:var(--bad)}
/* today = rust ring + rust number; selected = solid orange fill. They never look alike. */
.cal button.today{border:2px solid var(--brand2)}
.cal button.today .d{color:var(--brand2)}
.cal button.today .t{color:var(--brand2);font-weight:500}
.cal button.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cal button.sel .d,.cal button.sel .t{color:var(--accent-ink)}
.cal button.sel.today{border:2px solid var(--brand2)}
.cal button:disabled{opacity:.45}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8125rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.btn{min-height:52px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:500;padding:10px 18px}
.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:44px;padding:6px 14px}
.btn:disabled{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-block;font-size:.8125rem;border-radius:999px;padding:2px 10px;background:var(--off);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;min-height:52px;border:0;background:transparent;border-radius:999px;color:var(--muted);font-weight:500;font-size:.9375rem}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.nm{font-family:var(--f-display);font-size:1.25rem}
.lines{margin:0;display:flex;flex-direction:column;gap:6px}
.lines>div{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.lines dt{color:var(--muted);min-width:0}
.lines dd{margin:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.lines .neg dd{color:var(--bad)}
.lines .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:500}
.lines .tot dt{color:var(--fg)}
.lines .tot dd{font-family:var(--f-display);font-size:1.5rem;color:var(--brand2)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:.8125rem;color:var(--muted)}
input[type=number],input[type=text],input[type=time],input[type=tel],input[type=date],select{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:6px 12px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.netbox{display:flex;justify-content:space-between;align-items:baseline;background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.netbox b{font-family:var(--f-display);font-size:1.75rem;color:var(--brand2);font-variant-numeric:tabular-nums}
.sec{margin:6px 0 0;font-size:.875rem;color:var(--brand2);font-family:var(--f-display);font-weight:400;border-top:1px solid var(--line);padding-top:12px}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ctl .cl{display:flex;flex-direction:column;min-width:0}
.ctl .cl label{font-size:1rem;color:var(--fg)}
.ctl .step b{min-width:3ch}
.ctl .amt{width:7.5rem;text-align:right}
.proofs{display:flex;flex-wrap:wrap;gap:10px}
.proof{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.thumb{padding:0;border:0;background:none;cursor:zoom-in;display:block}
.lb{position:fixed;inset:0;z-index:50;background:rgba(58,31,20,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.lb img{max-width:100%;max-height:calc(100dvh - 96px);object-fit:contain;border-radius:8px;background:#fff}
.lb iframe{width:100%;max-width:720px;height:calc(100dvh - 96px);border:0;background:#fff;border-radius:8px}
.proof img{width:96px;height:128px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--off);display:block}
.proof .pdf{width:96px;height:128px;border-radius:10px;border:1px solid var(--line);background:var(--off);display:flex;align-items:center;justify-content:center;color:var(--brand2);font-weight:500}
.filebtn{position:relative;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.bank{display:flex;flex-direction:column;gap:2px}
.accno{font-family:var(--f-display);font-size:1.5rem;letter-spacing:.04em;font-variant-numeric:tabular-nums;user-select:all}
.advc{border:1px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.btn[disabled]{opacity:.5}
.cal.mini button,.cal.mini .blank{min-height:40px}
.addrow{display:flex;gap:8px;align-items:center}
.addrow select{flex:1.4;min-width:0}.addrow input{flex:1;min-width:0;text-align:right}
.step{display:flex;align-items:center;gap:10px}
.step button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.25rem}
.step b{min-width:2ch;text-align:center;font-variant-numeric:tabular-nums;font-size:1.125rem}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px dashed var(--line);padding-block:4px}
.seg{display:flex;gap:4px;background:var(--off);border-radius:999px;padding:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500;box-shadow:0 1px 4px rgba(58,31,20,.18)}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.picks button{min-height:48px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.picks.one{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.picks.one button{padding:6px 2px;min-height:52px;line-height:1.25;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picks.one button small{display:block;font-size:.6875rem}
.picks button small{color:var(--muted);font-size:.75rem}
.picks button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.picks button[aria-pressed="true"] small{color:var(--accent-ink)}
.mcal button.mine{background:var(--brand2);border-color:var(--brand2);color:var(--on-brand2)}
.mcal button.mine .d{color:var(--on-brand2)}
.mcal button{min-height:84px;justify-content:flex-start;gap:2px}
.chip{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.625rem;line-height:1.35;border-radius:5px;padding:0 4px;border:1px solid transparent;font-weight:500}
.legend .chip{display:inline-block;font-size:.75rem}
.chip.spk{background:var(--bad-soft);color:var(--bad)}
.chip.twn{background:var(--accent-soft);color:var(--accent-ink)}
.chip.ot{background:var(--ok-soft);color:var(--ok)}
.chip.pend{background:transparent;border:1px dashed currentColor}
.mcal button.sel{background:var(--accent);color:var(--accent-ink)}
.mcal button.sel .chip.twn{background:var(--surface)}
.brow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 20px}
.brow .bl{min-width:3.5em;font-weight:500;color:var(--brand2)}
.mou{background:var(--accent-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mou .row{align-self:stretch}
.srow{display:grid;grid-template-columns:64px repeat(2,minmax(0,1fr));gap:6px;align-items:start;padding:8px;border-radius:10px;border:1px solid transparent}
.srow.today{border-color:var(--brand2);background:var(--accent-soft)}
.srow .dl{font-weight:500;font-variant-numeric:tabular-nums}
.srow .dl small{display:block;font-weight:400;color:var(--muted)}
.srow .c{font-size:.875rem;min-width:0}
.srow .c.x{color:var(--ok)}
.shead{display:grid;grid-template-columns:64px repeat(2,minmax(0,1fr));gap:6px;padding-inline:8px;font-size:.8125rem;color:var(--muted);font-weight:500}
.slip{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.slip .sh{background:var(--brand2);color:var(--on-brand2);padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap}
.slip .sh h3{font-size:1.25rem}
.slip .sb{padding:16px;display:flex;flex-direction:column;gap:14px}
.slip .words{background:var(--accent-soft);color:var(--brand2);border-radius:10px;padding:10px 12px;font-size:.9375rem}
.slip h4{margin:0 0 8px;font-family:var(--f-display);font-size:1.25rem;line-height:1.3;color:var(--brand2);font-weight:400}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-weight:400;font-size:1.125rem;margin-bottom:4px}
.note{font-size:.8125rem;color:var(--muted)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:420px;background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 16px;text-align:center;z-index:5}
.scroll{overflow-x:auto}

/* ---- Compact density: sizes matched to NNMKP Hub (smaller controls, tighter cards, smaller big numbers). Remove this block to go back to the roomy layout. ---- */
html{font-size:14.5px}
body{font-size:15px;padding-inline:20px;padding-block:16px 84px}
.app{gap:12px}
.top{padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,calc(50vw - 300px)) 14px}
.top .who b{font-size:1.3rem}
.circ{width:40px;height:40px}.circ svg{width:20px;height:20px}
.card{padding:14px;gap:10px;border-radius:16px}
.nav button{min-width:40px;min-height:40px;font-size:1.125rem}
.nav b{font-size:1.0625rem}
.btn{min-height:44px;padding:8px 16px}
.btn.sm{min-height:36px;padding:4px 12px}
.tabs{padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs button{min-height:44px;font-size:.875rem}
.seg{padding:3px}.seg button{min-height:36px}
.picks{gap:6px}
.picks button{min-height:38px;padding:4px 14px}
.picks.one button{min-height:46px;padding:4px 2px}
.cal{gap:3px}
.cal button,.cal .blank{min-height:50px}
.mcal button{min-height:72px}
input[type=number],input[type=text],input[type=time],input[type=tel],input[type=date],select{min-height:40px;padding:4px 10px}
.step button{width:40px;height:40px}
.pad button{min-height:56px;font-size:1.375rem}
.acct-main{min-height:64px;padding-block:8px}
.acct-main .av{width:46px;height:46px}.acct-main .av svg{width:24px;height:24px}
.acct-x{height:64px}
.tile{min-height:60px;padding:10px 14px}
.lines .tot dd{font-size:1.25rem}
.netbox{padding:8px 12px}.netbox b{font-size:1.5rem}
.accno{font-size:1.25rem}
.slip .sh{padding:12px 14px}.slip .sh h3{font-size:1.125rem}
.slip .sb{padding:14px;gap:12px}
.mou{padding:10px}
/* ---- Settings overlap fix ---- */
.two>*{min-width:0}
.two input,.two select{min-width:0;max-width:100%;width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none;text-align:left;text-overflow:ellipsis;display:block;margin:0}
.two input[type=time]{text-align:left;-webkit-min-logical-width:0;line-height:normal}
.two input[type=time]::-webkit-date-and-time-value{text-align:left;min-width:0}
.card .two{grid-template-columns:repeat(2,minmax(0,1fr))}
.fld.full{grid-column:1/-1}
.fld .addrow input{text-align:left;width:auto;flex:1}
.fld .addrow .btn{flex:none;white-space:nowrap}
/* no double-tap zoom; inputs 16px so iOS doesn't zoom on focus */
html,body,button,a,input,select,label,.pad,.pad *{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,.pad{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select,textarea{font-size:16px!important}
/* loan progress (staff เบิกเงิน tab) */
.lbar{height:10px;border-radius:99px;background:var(--line,#f0dcb0);overflow:hidden}
.lbar i{display:block;height:100%;border-radius:99px;background:var(--orange,#f79922)}
.lbar.done i{background:#3f9a5b}
.ch .pill{white-space:nowrap;flex:none}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lgrid>div{background:#fff8e8;border:1px solid #f0dcb0;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lgrid small{color:var(--muted);font-size:.75rem}
.lgrid b{font-size:1.0625rem}
.lgrid .big{grid-column:1/-1;background:#fff3d9}
.lgrid .big b{font-size:1.375rem;color:#973b20}
.lhist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:.8125rem;color:var(--muted)}
.lhist li{display:flex;justify-content:space-between;gap:8px}
.pair{display:flex;flex-direction:column;gap:0;width:100%;min-width:0}
.pair .chip:first-child{border-bottom-left-radius:0;border-bottom-right-radius:0}
.pair .chip.ot{border-top-left-radius:0;border-top-right-radius:0;overflow:visible;text-overflow:clip;padding:0 2px;text-align:center}
.pair .chip:first-child{text-align:center}
.mcal .chip{overflow:visible;text-overflow:clip;padding:0 2px;text-align:center;letter-spacing:-.01em}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:16px;min-height:54px;font-size:.75rem;line-height:1.2}
.tabs button svg{flex:none;pointer-events:none}
.tabs button span{pointer-events:none;white-space:nowrap}
.tabs button[aria-current="page"]{background:#fbe9cc;color:#973b20;font-weight:500}
.bell{position:relative}
.bell .bdg{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#c0392b;color:#fff;font:600 .6875rem/18px var(--f-body);font-style:normal;text-align:center;box-sizing:border-box}
.bell[aria-pressed="true"]{background:rgba(255,255,255,.2)}
.top>.circ.bell+.circ{margin-left:0}
.nlist{display:flex;flex-direction:column;gap:8px}
.nitem{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--fg);font:inherit;position:relative}
.nitem.fresh{background:#fff3d9;border-color:#f3d79a}
.nic{flex:none;width:36px;height:36px;border-radius:50%;background:#fbe9cc;color:#973b20;display:flex;align-items:center;justify-content:center}
.nitem.bad .nic{background:#f7d9d2;color:#b3392b}
.ntx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.ntx b{font-weight:500}
.ntx span{color:var(--muted);font-size:.875rem}
.ntx small{color:var(--muted);font-size:.75rem;opacity:.85}
.ndot{flex:none;width:9px;height:9px;border-radius:50%;background:#c0392b;margin-top:6px}
.top{justify-content:flex-start;gap:10px}
.top .who{margin-right:auto}
</style>

<body>
<div id="sbtint" aria-hidden="true"></div>
<div id="splash" class="splash" role="status" aria-live="polite"><img src="icons/icon-192.png" width="132" height="132" alt="" decoding="sync"><b>NNMKP Staff</b><div class="ld" aria-hidden="true"><i></i></div><span class="ldtxt">กำลังโหลด…</span></div>
<div class="app" id="app"></div>
<div id="toast" hidden role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>

(function(){
'use strict';
var $app=document.getElementById('app'), $toast=document.getElementById('toast');
var CFG=window.NNMKP_CONFIG||{};
var DB=null, ASSETS=null, SB=null, tt=0;
var S={staff:[],off:[],adv:[],loans:[],notices:[],paystaff:null,loginMode:'',failMsg:'',apick:0,pay:{},cfg:null,ready:{staff:false,off:false,pay:false,cfg:false,adv:false,loans:false},session:null,tab:'cal',ym:null,sel:null,msel:null,pstaff:null,pcover:'auto',sview:'cal',pick:null,pin:'',canWrite:null,dirty:false,fail:false};

/* ---------- helpers ---------- */
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})};
var TH_M=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var TH_D=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
var TH_DS=['อา','จ','อ','พ','พฤ','ศ','ส'];
var pad=function(n){return String(n).padStart(2,'0')};
var fmt=function(n){return Number(n||0).toLocaleString('en-US')};
var dstr=function(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)};
var todayStr=function(){var d=new Date();return dstr(d.getFullYear(),d.getMonth(),d.getDate())};
var ymLabel=function(ym){var p=ym.split('-');return TH_M[+p[1]-1]+' '+(+p[0]+543)};
var shiftLabel=function(s){return (s.shift==='morning'?'กะเช้า':'กะค่ำ')+' '+(s.start||'')+'–'+(s.end||'')};
var dateLong=function(ds){var p=ds.split('-').map(Number);var d=new Date(p[0],p[1]-1,p[2]);return 'วัน'+TH_D[d.getDay()]+'ที่ '+p[2]+' '+TH_M[p[1]-1]+' '+(p[0]+543)};
var dateShort=function(ds){var p=ds.split('-').map(Number);return p[2]+' '+TH_M[p[1]-1]};

var NUM=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],POS=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
function chunk(n){var s=String(n),o='';for(var i=0;i<s.length;i++){var d=+s[i],p=s.length-i-1;if(!d)continue;
  if(p===0&&d===1&&s.length>1)o+='เอ็ด';else if(p===1&&d===2)o+='ยี่สิบ';else if(p===1&&d===1)o+='สิบ';else o+=NUM[d]+POS[p];}return o}
function words(n){if(n>=1e6)return words(Math.floor(n/1e6))+'ล้าน'+(n%1e6?chunk(n%1e6):'');return chunk(n)}
function bahtText(n){n=Math.round(n);var a=Math.abs(n);return (n<0?'ลบ':'')+(a===0?'ศูนย์':words(a))+'บาทถ้วน'}

function toast(msg){$toast.textContent=msg;$toast.hidden=false;clearTimeout(tt);tt=setTimeout(function(){$toast.hidden=true},3200)}

/* ---------- data access ---------- */
function C(){return Object.assign({allowance:4,extraRate:400,mistakeRate:50,otRate:100,mouPlan:{},carryFrom:'2026-09',advFrom:15,advMax:3000},S.cfg||{})}
function me(){return S.staff.find(function(s){return S.session&&s.id===S.session.id})}
function coverOf(o){
  var st=staffById(o.staffId); if(!st||o.coverId==='none')return null;
  if(o.coverId&&o.coverId!==o.staffId&&staffById(o.coverId))return o.coverId;
  var m=mateOf(st); return m?m.id:null;
}
function coveredOn(sid,ds){return S.off.find(function(o){return o.date===ds&&o.status==='approved'&&coverOf(o)===sid})}
function mateOf(st){return S.staff.find(function(s){return s.branch===st.branch&&s.id!==st.id})}
function offOf(sid,date){return S.off.find(function(o){return o.staffId===sid&&o.date===date})}
function staffById(id){return S.staff.find(function(s){return s.id===id})}
function coverHours(a,b){var s=[a.start,b.start].sort()[0],e=[a.end,b.end].sort().slice(-1)[0];return s+'–'+e}

var queue={};
function save(path,body){
  queue[path]=(queue[path]||Promise.resolve()).then(function(){return DB.doc(path).set(body)}).catch(function(e){
    toast(S.canWrite===false||(e&&e.code==='invalid_argument')?'บันทึกไม่ได้ บัญชีนี้ไม่มีสิทธิ์แก้ไขข้อมูล':'บันทึกไม่สำเร็จ ลองอีกครั้ง');
  });
  return queue[path];
}
function del(path){
  queue[path]=(queue[path]||Promise.resolve()).then(function(){return DB.doc(path).delete()}).catch(function(){toast('ลบไม่สำเร็จ ลองอีกครั้ง')});
  return queue[path];
}
function patchPay(ym,sid,patch){
  var key=ym+'_'+sid;
  var cur=S.pay[key]||{ym:ym,staffId:sid,ot:0,mistakes:0,items:[],published:false};
  return save('payroll/'+key,Object.assign({},cur,patch,{ym:ym,staffId:sid}));
}

function prevYm(ym){var p=ym.split('-').map(Number),d=new Date(p[0],p[1]-2,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function offCount(st,ym){return S.off.filter(function(o){return o.staffId===st.id&&o.status==='approved'&&o.date.indexOf(ym)===0}).length}
/* Allowance for a month = base - days taken over last month's allowance (auto, from carryFrom) + manual adjustment. Never below 0. */
function allowInfo(st,ym){
  var cfg=C(), p=S.pay[ym+'_'+st.id]||{}, adj=+p.allowAdj||0, carry=0, prev=prevYm(ym);
  if(prev>=cfg.carryFrom){var pi=allowInfo(st,prev);carry=-Math.max(0,offCount(st,prev)-pi.eff)}
  return {base:cfg.allowance,carry:carry,adj:adj,eff:Math.max(0,cfg.allowance+carry+adj)};
}

function calc(st,ym){
  var cfg=C();
  var off=S.off.filter(function(o){return o.staffId===st.id&&o.status==='approved'&&o.date.indexOf(ym)===0}).length;
  var p=S.pay[ym+'_'+st.id]||{};
  var coverDates=S.off.filter(function(o){return o.status==='approved'&&o.date.indexOf(ym)===0&&coverOf(o)===st.id}).map(function(o){return o.date}).sort();
  var coverAmt=coverDates.length*cfg.otRate;
  var ai=allowInfo(st,ym), extraDays=Math.max(0,ai.eff-off), extra=extraDays*cfg.extraRate;
  var ot=+p.ot||0, mistakes=+p.mistakes||0, items=p.items||[];
  var mAmt=mistakes*cfg.mistakeRate, iAmt=items.reduce(function(a,i){return a+(+i.amount||0)},0);
  var advs=S.adv.filter(function(a){return a.staffId===st.id&&a.status==='approved'&&a.ym===ym}).sort(function(a,b){return a.date<b.date?-1:1}).map(function(a){return {date:a.date,amount:+a.amount||0}});
  var advAmt=advs.reduce(function(x,a){return x+a.amount},0);
  var base=+st.base||0;
  return {adv:advs,advAmt:advAmt,coverDates:coverDates,coverDays:coverDates.length,coverRate:cfg.otRate,coverAmt:coverAmt,off:off,extraDays:extraDays,extra:extra,rate:cfg.extraRate,mrate:cfg.mistakeRate,allowance:ai.eff,ai:ai,ot:ot,mistakes:mistakes,mAmt:mAmt,items:items,iAmt:iAmt,base:base,
    net:base+extra+ot+coverAmt-mAmt-iAmt-advAmt,published:!!p.published,slip:p.slip||null};
}

function mouInfo(st,ym){
  var total=+st.mouTotal||0; if(!total)return null;
  var paidBefore=+st.mouPaid||0, prior=0, thisM=0;
  Object.keys(S.pay).forEach(function(k){var p=S.pay[k]; if(!p||p.staffId!==st.id)return;
    (p.items||[]).forEach(function(i){if(!i.mou)return; if(p.ym===ym)thisM+=+i.amount||0; else if(p.ym<ym)prior+=+i.amount||0})});
  var before=Math.max(0,total-paidBefore-prior);
  var plan=+((C().mouPlan||{})[ym])||0;
  var left=Math.max(0,before-thisM);
  return {total:total,thisM:thisM,before:before,left:left,deducted:total-left,plan:plan,suggest:thisM?0:Math.min(plan,before)};
}

/* ---------- views ---------- */
function navHtml(){return '<div class="nav"><button data-act="ym" data-d="-1" aria-label="เดือนก่อน">‹</button><b>'+esc(ymLabel(S.ym))+'</b><button data-act="ym" data-d="1" aria-label="เดือนถัดไป">›</button></div>'}

function vLogin(){
  var h=band('ตารางงาน วันหยุด สลิปเงินเดือน',false);
  if(S.pick){
    var dots='';for(var i=0;i<6;i++)dots+='<i class="'+(i<S.pin.length?'on':'')+'"></i>';
    var keys='';[1,2,3,4,5,6,7,8,9].forEach(function(k){keys+='<button data-act="pin" data-k="'+k+'">'+k+'</button>'});
    keys+='<button class="fn" data-act="pickback">กลับ</button><button data-act="pin" data-k="0">0</button><button class="fn" data-act="pinback" aria-label="ลบ">ลบ</button>';
    return h+'<div class="card"><h1>'+esc(S.pick.name||S.pick.phone)+'</h1><div class="sub" style="margin-top:-8px">กดรหัส PIN 6 หลัก</div><div class="dots" aria-label="รหัสที่กดแล้ว '+S.pin.length+' หลัก">'+dots+'</div><div class="pad">'+keys+'</div>'+(S.pick.mgr?'<button class="btn alt" data-act="mgrpw" style="margin-top:12px">ใช้อีเมลและรหัสผ่านแทน</button>':'')+'</div>';
  }
  var mem=memAccts(), mg=memMgr();
  if(S.loginMode==='mgr'){
    return h+'<div class="card"><h1 style="font-size:1.5rem">เจ้าของ / ผู้จัดการ</h1><div class="fld"><label for="m-email">อีเมล</label><input id="m-email" type="email" autocomplete="username" inputmode="email" value="'+esc(mg)+'"></div><div class="fld"><label for="m-pw">รหัสผ่าน</label><input id="m-pw" type="password" autocomplete="current-password"></div><button class="btn" data-act="mgrsubmit">เข้าสู่ระบบ</button><button class="btn alt" data-act="acctback">กลับ</button></div>';
  }
  if(S.loginMode==='phone'||(!mem.length&&!mg)){
    h+='<div class="card"><h1 style="font-size:1.5rem">เข้าสู่ระบบ</h1><div class="fld"><label for="login-phone">เบอร์โทรของคุณ</label><input id="login-phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="0xxxxxxxxx"></div><button class="btn" data-act="phonenext">ถัดไป</button>'+(mem.length?'<button class="btn alt" data-act="acctback">กลับ</button>':'')+'</div>';
  }else{
    h+='<div class="card acctcard"><h1 style="font-size:1.25rem">เลือกบัญชีที่เคยใช้</h1>'
      +(mg?'<div class="acct"><button class="acct-main" data-act="mgrpick"><span class="av">'+ICON_USER+'</span><span class="ai"><b>ผู้จัดการ</b><small>'+esc(mg)+'</small></span><span class="chev">'+ICON_CHEV+'</span></button>'
          +'<button class="acct-x" data-act="mgrforget" aria-label="ลบบัญชีผู้จัดการออกจากเครื่องนี้">'+ICON_X+'</button></div>':'')
      +mem.map(function(r){
        return '<div class="acct"><button class="acct-main" data-act="pick" data-phone="'+esc(r.phone)+'" data-name="'+esc(r.name||'')+'"><span class="av">'+ICON_USER+'</span><span class="ai"><b>'+esc(r.name||r.phone)+'</b><small>'+esc(r.phone)+'</small></span><span class="chev">'+ICON_CHEV+'</span></button>'
          +'<button class="acct-x" data-act="forget" data-phone="'+esc(r.phone)+'" aria-label="ลบบัญชี '+esc(r.name||r.phone)+' ออกจากเครื่องนี้">'+ICON_X+'</button></div>'}).join('')+'</div>'
      +'<button class="btn alt" data-act="addacct">ใช้บัญชีอื่น</button>';
  }
  return h+(mg?'':'<button class="btn alt" data-act="mgrlogin" style="margin-top:12px">เจ้าของ / ผู้จัดการ</button>');
}
var ICON_USER='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3-6 7-6s7 2.4 7 6"/></svg>';
var ICON_CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
var ICON_X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function memMgr(){try{return localStorage.getItem('nnmkp-mgr')||''}catch(e){return ''}}
function setMgr(v){try{if(v)localStorage.setItem('nnmkp-mgr',v);else localStorage.removeItem('nnmkp-mgr')}catch(e){}}
function memAccts(){try{var a=JSON.parse(localStorage.getItem('nnmkp-accts')||'[]');return Array.isArray(a)?a.filter(function(x){return x&&x.phone}):[]}catch(e){return []}}
function setMem(a){try{localStorage.setItem('nnmkp-accts',JSON.stringify(a))}catch(e){}}
function remember(){
  if(!S.rememberPhone||!S.session||S.session.role!=='staff')return;var st=me();if(!st)return;
  var m=memAccts().filter(function(x){return x.phone!==S.rememberPhone});m.push({phone:S.rememberPhone,name:st.name});setMem(m);S.rememberPhone='';
}

var ICON_OUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M16 8l4 4-4 4"/><path d="M20 12H9"/></svg>';
var ICON_BELL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>';
function band(sub,withOut,extra){
  return '<div class="top"><div class="who"><b>NNMKP Staff</b><span>'+esc(sub)+'</span></div>'
    +(extra||'')+(withOut?'<button class="circ" data-act="logout" aria-label="ออกจากระบบ">'+ICON_OUT+'</button>':'')+'</div>';
}
function header(){
  var st=me(), n=notifs(), un=notifUnread(n);
  var bell='<button class="circ bell" data-act="bell" aria-label="การแจ้งเตือน'+(un?' '+un+' รายการใหม่':'')+'"'+(S.notif?' aria-pressed="true"':'')+'>'+ICON_BELL+(un?'<i class="bdg">'+(un>9?'9+':un)+'</i>':'')+'</button>';
  return band(S.session.role==='mgr'?'ผู้จัดการ · จัดการทีมทั้งสองสาขา':(st?st.name+' · '+st.branch+' · '+shiftLabel(st):''),true,bell);
}
/* ----- notifications (คำนวณจากข้อมูลที่มีอยู่ ไม่ต้องเพิ่มตารางใหม่) ----- */
function seenKey(){return 'nnmkp-seen-'+(S.session&&S.session.id||'mgr')}
function getSeen(){try{return +localStorage.getItem(seenKey())||0}catch(e){return 0}}
function setSeen(t){try{localStorage.setItem(seenKey(),String(t))}catch(e){}}
function notifs(){
  if(!S.session||!S.ready||!ready())return [];
  var out=[], mgr=S.session.role==='mgr', cut=Date.now()-30*864e5;
  if(mgr){
    S.off.filter(function(o){return o.status==='pending'}).forEach(function(o){var st=staffById(o.staffId);if(!st)return;
      out.push({k:'o'+o.id,at:+o.at||0,tab:'req',ico:'cal',title:'คำขอหยุดใหม่',body:st.name+' ('+st.branch+') ขอหยุดวันที่ '+dateShort(o.date),pend:true})});
    S.adv.filter(function(a){return a.status==='pending'}).forEach(function(a){var st=staffById(a.staffId);if(!st)return;
      out.push({k:'a'+a.id,at:+a.at||0,tab:'req',ico:'pay',title:'คำขอเบิกเงินล่วงหน้า',body:st.name+' ('+st.branch+') ขอเบิก ฿'+fmt(a.amount),pend:true})});
    S.notices.filter(function(n){return n.kind==='dayoff_cancel'&&n.by==='staff'}).forEach(function(n){var st=staffById(n.staffId);if(!st)return;
      out.push({k:'nc'+n.id,at:+n.at||0,tab:'sched',ico:'cal',title:'พนักงานยกเลิกวันหยุด',body:st.name+' ('+st.branch+') ยกเลิกวันหยุดวันที่ '+dateShort(n.date),bad:true})});
    out=out.filter(function(n){return n.pend||n.at>cut});
  }else{
    var id=S.session.id;
    S.notices.filter(function(n){return n.kind==='dayoff_cancel'&&n.by==='mgr'&&n.staffId===id}).forEach(function(n){
      out.push({k:'nc'+n.id,at:+n.at||0,tab:'cal',ico:'cal',title:'ผู้จัดการยกเลิกวันหยุด',body:'วันหยุดวันที่ '+dateShort(n.date)+' ถูกยกเลิก',bad:true})});
    S.off.filter(function(o){return o.staffId===id&&o.decidedAt}).forEach(function(o){var ok=o.status==='approved';
      out.push({k:'od'+o.id,at:o.decidedAt,tab:'cal',ico:'cal',title:ok?'อนุมัติวันหยุดแล้ว':'ไม่อนุมัติวันหยุด',body:ok?'วันหยุดวันที่ '+dateShort(o.date)+' ได้รับการอนุมัติ':'คำขอหยุดวันที่ '+dateShort(o.date)+' ไม่ได้รับการอนุมัติ',bad:!ok})});
    S.adv.filter(function(a){return a.staffId===id}).forEach(function(a){
      if(a.decidedAt&&(a.status==='approved'||a.status==='rejected')){var ok=a.status==='approved';

function loanInfo(l,ym){
  var prior=0,thisM=0;
  Object.keys(S.pay).forEach(function(k){var p=S.pay[k]; if(!p||p.staffId!==l.staffId)return;
    (p.items||[]).forEach(function(i){if(i.loan!==l.id)return; if(p.ym===ym)thisM+=+i.amount||0; else if(p.ym<ym)prior+=+i.amount||0})});
  var total=+l.total||0, before=Math.max(0,total-(+l.paidBefore||0)-prior), left=Math.max(0,before-thisM);
  var due=ym>=(l.start||'0000-00')?Math.min(+l.monthly||0,before):0;
  return {total:total,before:before,left:left,thisM:thisM,suggest:thisM?0:due};
}

function toggleOff(sid,ds){

function callFn(body){

    if(r.error){var cx=r.error.context;if(cx&&cx.json)return cx.json().then(function(j){throw new Error(j.error||'ไม่สำเร็จ')},function(){throw new Error('ไม่สำเร็จ')});throw r.error}

var started=false;
function startData(){
  if(started)return;started=true;
  var onErr=function(){S.fail=true;render()};
  DB.collection('staff').onSnapshot(function(s){
    S.staff=s.docs.map(function(d){return Object.assign({id:d.id},d.data())}).sort(function(a,b){return (a.ord||99)-(b.ord||99)});
    S.ready.staff=true;schedule()},onErr);
  DB.collection('dayoffs').onSnapshot(function(s){
    S.off=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});S.ready.off=true;schedule()},onErr);
  DB.collection('notices').onSnapshot(function(s){S.notices=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});schedule()},function(){});
  DB.collection('loans').onSnapshot(function(s){
    S.loans=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});S.ready.loans=true;schedule()},onErr);
  DB.collection('advances').onSnapshot(function(s){
    S.adv=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});S.ready.adv=true;schedule()},onErr);
  DB.collection('payroll').onSnapshot(function(s){
    var m={};s.docs.forEach(function(d){m[d.id]=d.data()});S.pay=m;S.ready.pay=true;schedule()},onErr);
  DB.doc('settings/config').onSnapshot(function(s){
    S.cfg=s.exists?s.data():null;S.ready.cfg=true;schedule()},onErr);
}
function enterSession(user){

    var mgr=p.role==='manager';
    if(mgr&&user.email)setMgr(user.email);
    S.session=mgr?{role:'mgr'}:{role:'staff',id:p.staff_id};

    case 'unpublish':{patchPay(S.ym,d.id,{published:false,slip:null});break}
    case 'addstaff':{
      var nm=document.getElementById('n-name').value.trim(), pin=document.getElementById('n-pin').value.trim(), base=Number(document.getElementById('n-base').value), phn=document.getElementById('n-phone').value.replace(/\D/g,'');

      save('staff/'+nid,{name:nm,branch:br,shift:sh,start:tm[0],end:tm[1],base:base,phone:phn,ord:S.staff.length+1}).then(function(){return callFn({staffId:nid,phone:phn,pin:pin})}).then(function(){toast('เพิ่มพนักงานแล้ว')}).catch(function(e){toast((e&&e.message)||'สร้างบัญชีไม่สำเร็จ')});break}
    case 'setmgrpin':{var q1=document.getElementById('mp1').value.trim(),q2=document.getElementById('mp2').value.trim();
      if(!/^\d{6}$/.test(q1)){toast('PIN ต้องเป็นเลข 6 หลัก');break}
      if(q1!==q2){toast('PIN สองช่องไม่ตรงกัน');break}
      if(/^(\d)\1{5}$/.test(q1)||q1==='123456'||q1==='654321'||q1==='012345'){toast('PIN เดาง่ายเกินไป ลองเลขอื่น');break}
      SB.auth.updateUser({password:q1}).then(function(r){
        if(r.error){toast(/reauth|recent/i.test(r.error.message||'')?'ต้องเข้าสู่ระบบใหม่ก่อนจึงเปลี่ยน PIN ได้':(r.error.message||'ตั้ง PIN ไม่สำเร็จ'));return}
        document.getElementById('mp1').value='';document.getElementById('mp2').value='';toast('ตั้ง PIN ผู้จัดการแล้ว ครั้งต่อไปเข้าด้วย PIN ได้เลย')
      }).catch(function(){toast('ตั้ง PIN ไม่สำเร็จ')});break}
    case 'setpin':{var sp=staffById(d.id),pinp=document.getElementById('p-'+d.id);if(!sp||!pinp)break;var pn=pinp.value.trim(),phs=String(sp.phone||'').replace(/\D/g,'');
      if(phs.length<9){toast('ใส่เบอร์โทรของพนักงานก่อน');break}
      if(!/^\d{6}$/.test(pn)){toast('PIN ต้องเป็นเลข 6 หลัก');break}
      callFn({staffId:sp.id,phone:phs,pin:pn}).then(function(){pinp.value='';toast('ตั้ง PIN ของ'+sp.name+'แล้ว')}).catch(function(e){toast((e&&e.message)||'ตั้ง PIN ไม่สำเร็จ')});break}
  }
});

/* ---------- Supabase adapters (same shape the app used before) ---------- */
function mkAdapter(sb){
  var subs={}, timers={}, STAFF_PUB=['name','branch','shift','start','end','ord'];
  function fetchCol(col){
    if(col==='staff'){
      return Promise.all([sb.from('docs').select('id,data').eq('col','staff'),sb.from('docs').select('id,data').eq('col','staff_private')]).then(function(r){
        if(r[0].error)throw r[0].error;
        var priv={};(r[1].data||[]).forEach(function(x){priv[x.id]=x.data});
        return r[0].data.map(function(x){return {id:x.id,data:Object.assign({},x.data,priv[x.id]||{})}});
      });
    }
    return sb.from('docs').select('id,data').eq('col',col).then(function(r){if(r.error)throw r.error;return r.data});
  }
  function colSnap(rows){return {docs:rows.map(function(r){return {id:r.id,data:function(){return r.data}}})}}
  function docSnap(rows,id){var row=rows.find(function(r){return r.id===id});return {exists:!!row,data:function(){return row?row.data:undefined}}}
  function emit(col){
    var l=subs[col]||[];if(!l.length)return;
    fetchCol(col).then(function(rows){l.forEach(function(s){s.cb(s.kind==='doc'?docSnap(rows,s.id):colSnap(rows))})})
      .catch(function(e){l.forEach(function(s){if(s.err)s.err(e)})});
  }
  function later(col){clearTimeout(timers[col]);timers[col]=setTimeout(function(){emit(col)},150)}
  function sub(col,cb,err,kind,id){(subs[col]=subs[col]||[]).push({cb:cb,err:err,kind:kind,id:id});emit(col)}
  sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},function(p){
    var c=(p.new&&p.new.col)||(p.old&&p.old.col);
    if(!c){Object.keys(subs).forEach(later);return}
    later(c==='staff_private'?'staff':c);
  }).subscribe();
  function write(col,id,body){
    var now=new Date().toISOString(), rows;
    if(col==='staff'){
      var pub={},prv={};Object.keys(body).forEach(function(k){if(k==='pin'||k==='id')return;(STAFF_PUB.indexOf(k)>=0?pub:prv)[k]=body[k]});
      rows=[{col:'staff',id:id,staff_id:id,data:pub,updated_at:now},{col:'staff_private',id:id,staff_id:id,data:prv,updated_at:now}];
    }else rows=[{col:col,id:id,staff_id:body.staffId||null,data:body,updated_at:now}];
    return sb.from('docs').upsert(rows,{onConflict:'col,id'}).then(function(r){if(r.error)throw r.error;if(col==='staff')later('staff')});
  }
  function remove(col,id){
    var q=sb.from('docs').delete().eq('id',id);
    q=col==='staff'?q.in('col',['staff','staff_private']):q.eq('col',col);
    return q.then(function(r){if(r.error)throw r.error});
  }
  return {
    collection:function(c){return {onSnapshot:function(cb,err){sub(c,cb,err,'col')}}},
    doc:function(path){var p=path.split('/'),col=p[0],id=p[1];return {
      onSnapshot:function(cb,err){sub(col,cb,err,'doc',id)},
      set:function(body){return write(col,id,body)},
      delete:function(){return remove(col,id)}}}
  };
}
function mkAssets(sb){
  var cache={};
  return {
    upload:function(file,staffId){
      var ext=((file.name||'').split('.').pop()||'').toLowerCase().replace(/[^a-z0-9]/g,'')||(file.type==='application/pdf'?'pdf':'jpg');
      var path=(staffId||'misc')+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)+'.'+ext;
      return sb.storage.from('proofs').upload(path,file,{contentType:file.type||undefined,upsert:false}).then(function(r){
        if(r.error){var e=new Error(r.error.message);e.code=/size|large|exceed/i.test(r.error.message)?'too_large':/mime|type/i.test(r.error.message)?'unsupported_type':'upstream_error';throw e}
        return {id:path,contentType:file.type||'application/octet-stream'};
      });
    },
    delete:function(path){return sb.storage.from('proofs').remove([path])},
    signed:function(path){
      var c=cache[path];if(c&&c.exp>Date.now())return Promise.resolve(c.url);
      return sb.storage.from('proofs').createSignedUrl(path,3600).then(function(r){
        if(r.error||!r.data)throw r.error||new Error('no url');
        cache[path]={url:r.data.signedUrl,exp:Date.now()+3000*1000};return r.data.signedUrl});
    }
  };
}
